name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\.xmake\packages
          key: xmake-${{ runner.os }}-${{ hashFiles('xmake.lua', 'lib/commonlibsse-ng/xmake.lua') }}

      - name: Configure
        run: xmake config -y -m releasedbg --skyrim_vr=n

      - name: Build
        run: xmake build -y -v ScrollToSky

      - name: Package for MO2
        shell: pwsh
        run: |
          $out = "package/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem -Recurse build -Include ScrollToSky.dll,ScrollToSky.pdb | Copy-Item -Destination $out
          Copy-Item dist/SKSE/Plugins/ScrollToSky.ini $out
          Get-ChildItem -Recurse package

      - uses: actions/upload-artifact@v4
        with:
          name: ScrollToSky
          path: package/

      - name: Zip for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/SKSE/Plugins | Out-Null
          Copy-Item package/SKSE/Plugins/ScrollToSky.dll, package/SKSE/Plugins/ScrollToSky.ini release/SKSE/Plugins
          Compress-Archive -Path release/* -DestinationPath ScrollToSky.zip

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Scroll to Sky (latest build)
          body: "Automatic build from ${{ github.sha }}. Install ScrollToSky.zip with MO2."
          prerelease: true
          files: ScrollToSky.zip
