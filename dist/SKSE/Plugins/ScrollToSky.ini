; Scroll to Sky configuration
; Edits apply on next game launch.

[Zoom]
; Maximum third-person camera distance in game units. Vanilla is 600.
fMaxZoomDistance = 3000
; Zoom per mouse wheel notch near the player (0.005 to 0.5).
fZoomStep = 0.06
; How much faster each notch zooms as you get farther out. 0 = linear.
fDistanceScaling = 2.0
; Easing speed. Higher is snappier, lower is floatier.
fSmoothing = 9.0

[Map]
; Keep scrolling out past max zoom to open the world map.
bEnableMapTransition = 1
; Extra wheel notches past max zoom needed to open the map.
iOverscrollNotches = 2
; Seconds within which those notches must land.
fOverscrollWindow = 0.8
; Open the map at its lowest height so the motion reads as continuous. Experimental.
bStartMapZoomedIn = 1
; Do not open the map by scrolling while in combat.
bBlockInCombat = 0

[Return]
; Click a mouse button on the map to return to the max third-person distance.
; Scrolling in from there continues in normal gameplay. Default on.
bClickReturn = 1
; Mouse button for click return. 2 = wheel click. 3-7 = extra mouse buttons.
; The log reports whether this button already does something on the map.
iReturnButton = 2

; Scroll in past the map's lowest height to jump straight to close third person.
; Off by default: with World Map in Full 3D, scrolling in should zoom the map, not exit it.
bScrollReturn = 0
; Extra notches past the map's lowest height before returning (bScrollReturn).
iReturnNotches = 2
; Camera distance after a scroll return, in game units. 210 is about 3 meters.
fScrollReturnDistance = 210

[Debug]
bDebugLogging = 0
